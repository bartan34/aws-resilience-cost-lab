services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: localroot
      MYSQL_DATABASE: ca2
      MYSQL_USER: ca2
      MYSQL_PASSWORD: localpass
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uca2", "-plocalpass"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ca2
      DB_USER: ca2
      DB_PASSWORD: localpass
    depends_on:
      db:
        condition: service_healthy
